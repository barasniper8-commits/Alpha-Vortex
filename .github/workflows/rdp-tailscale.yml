
name: Windows RDP Cyberpunk

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: 'Masukkan Pass Kode dari web'
        required: true
        type: string
      input_user:
        description: 'Masukkan Username RDP'
        required: true
        type: string
      input_password:
        description: 'Masukkan Password RDP'
        required: true
        type: string
      tailscale_key:
        description: 'Masukkan Tailscale Auth Key'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validasi Input dan Membaca Web
        id: validate
        shell: pwsh
        env:
          PASS_CODE: ${{ inputs.pass_code }}
          INPUT_USER: ${{ inputs.input_user }}
          INPUT_PASSWORD: ${{ inputs.input_password }}
          TAILSCALE_KEY: ${{ inputs.tailscale_key }}
        run: |
          $ErrorActionPreference = "Stop"

          foreach ($secret in @(
            $env:PASS_CODE,
            $env:INPUT_PASSWORD,
            $env:TAILSCALE_KEY
          )) {
            if ($secret) {
              Write-Output "::add-mask::$secret"
            }
          }

          if ($env:INPUT_USER -notmatch '^[a-zA-Z0-9_.-]{1,20}$') {
            throw "Format username tidak valid."
          }

          if ([string]::IsNullOrWhiteSpace($env:INPUT_PASSWORD) -or
              $env:INPUT_PASSWORD.Length -lt 12) {
            throw "Gunakan password minimal 12 karakter."
          }

          if ($env:PASS_CODE -notmatch '^[a-zA-Z0-9_-]{4,100}$') {
            throw "Format passcode tidak valid."
          }

          if (-not $env:TAILSCALE_KEY.StartsWith("tskey-")) {
            throw "Format Tailscale Auth Key tidak valid."
          }

          $targetUrl = "https://arianto12.lynk.id/p/ganjay"

          try {
            $response = Invoke-WebRequest `
              -Uri $targetUrl `
              -UseBasicParsing `
              -TimeoutSec 25 `
              -Headers @{ "User-Agent" = "Mozilla/5.0" }

            $html = $response.Content

            # Mengambil teks halaman, bukan menganggap semua teks
            # sebagai passcode yang valid.
            $text = [System.Net.WebUtility]::HtmlDecode(
              [regex]::Replace($html, '<[^>]*>', ' ')
            )

            $passMatch = [regex]::Match(
              $text,
              '(?i)pass[\s_-]*code\s*[:=]\s*([A-Z0-9_-]+)'
            )

            if (-not $passMatch.Success) {
              throw "Passcode tidak ditemukan pada halaman web."
            }

            $allowedCode = $passMatch.Groups[1].Value.Trim()

            if ($env:PASS_CODE -cne $allowedCode) {
              throw "Passcode tidak cocok dengan data halaman web."
            }

            Write-Host "Validasi passcode berhasil."
          }
          catch {
            Write-Host "Validasi gagal: $($_.Exception.Message)"
            throw
          }

          # Lindungi nilai sensitif agar tidak muncul di log.
          Write-Host "Input telah lolos validasi dasar."

      - name: Konfigurasi Dark Mode Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $personalize = "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          if (-not (Test-Path $personalize)) {
            New-Item -Path $personalize -Force | Out-Null
          }

          Set-ItemProperty -Path $personalize `
            -Name AppsUseLightTheme -Value 0 -Type DWord

          Set-ItemProperty -Path $personalize `
            -Name SystemUsesLightTheme -Value 0 -Type DWord

          Write-Host "Konfigurasi dark mode selesai."

      - name: Membuat Akun RDP
        shell: pwsh
        env:
          RDP_USER: ${{ inputs.input_user }}
          RDP_PASS: ${{ inputs.input_password }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Output "::add-mask::$env:RDP_PASS"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASS -AsPlainText -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USER -ErrorAction SilentlyContinue

          if ($existingUser) {
            Set-LocalUser -Name $env:RDP_USER `
              -Password $securePassword
            Enable-LocalUser -Name $env:RDP_USER
          }
          else {
            New-LocalUser -Name $env:RDP_USER `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires | Out-Null
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USER `
            -ErrorAction SilentlyContinue

          Write-Host "Akun Windows berhasil dikonfigurasi."

      - name: Unduh Foto Profil dan Wallpaper
        shell: pwsh
        env:
          RDP_USER: ${{ inputs.input_user }}
        run: |
          $ErrorActionPreference = "Stop"

          $avatarUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjFqQRxOHnZXYINO_52beLKrfrMypBHzpnllWSHx6gQHO4yspMqi2skpfp8z0lvsOOWHjSJ6G33I8Y2rGXo8_FVAkrgnDxtYuWK_Z5go81NcvEoRV6koacWRU4HsXD0R3nqW69a1FJnxhzy2PI8z2PQKqxWIEc_mX3oOROBIj9Y3HW4NcEq6FcNzMyMMwA/s1600/1000184069.jpg"

          $wallpaperUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgRFqAvUV6j9-n3L65cySSsdK3JHZ88fKJlquXCK5pGhNRRlOmYfnIb3Zk4Y7SUC232-P5VcYgFZgiJ7jPfTR4HUmKtiOLG60FzYgby4m52MHOgXB0JuV5KZaR_3tdOPH5USQOqBx2GHYj_KTnntxjNzKKIh0VPFLAOaNoBlVJZi13KPvoWgjRRseVZObA/s1600/1000184023.jpg"

          $avatarFile = "C:\ProgramData\Arianto\avatar.jpg"
          $wallpaperFile = "C:\ProgramData\Arianto\wallpaper.jpg"

          New-Item -ItemType Directory `
            -Path "C:\ProgramData\Arianto" `
            -Force | Out-Null

          $wc = New-Object System.Net.WebClient
          $wc.Headers.Add("User-Agent", "Mozilla/5.0")

          try {
            $wc.DownloadFile($avatarUrl, $avatarFile)

            if ((Get-Item $avatarFile).Length -lt 1000) {
              throw "File avatar terlalu kecil."
            }

            $profilePath = "C:\ProgramData\Microsoft\User Account Pictures"

            New-Item -ItemType Directory `
              -Path $profilePath -Force | Out-Null

            Copy-Item $avatarFile `
              "$profilePath\default.jpg" -Force

            Write-Host "Foto profil berhasil diunduh."
          }
          catch {
            Write-Warning "Foto profil gagal diproses: $($_.Exception.Message)"
          }

          try {
            $wc.DownloadFile($wallpaperUrl, $wallpaperFile)

            if ((Get-Item $wallpaperFile).Length -lt 1000) {
              throw "File wallpaper terlalu kecil."
            }

            # Mengatur wallpaper untuk sesi pengguna runner.
            $wallpaperReg = "HKCU:\Control Panel\Desktop"

            Set-ItemProperty -Path $wallpaperReg `
              -Name Wallpaper -Value $wallpaperFile

            Add-Type @"
          using System.Runtime.InteropServices;
          public class AriantoWallpaper {
            [DllImport("user32.dll", SetLastError=true)]
            public static extern bool SystemParametersInfo(
              int action, int param, string path, int flags
            );
          }
          "@

            [AriantoWallpaper]::SystemParametersInfo(
              20, 0, $wallpaperFile, 3
            ) | Out-Null

            Write-Host "Wallpaper berhasil diunduh dan diterapkan ke sesi runner."
            Write-Host "Catatan: sesi RDP pengguna dapat memiliki profil wallpaper berbeda."
          }
          catch {
            Write-Warning "Wallpaper gagal diproses: $($_.Exception.Message)"
          }

      - name: Buat Informasi Pemilik di Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $desktopPath = "C:\Users\Public\Desktop"

          New-Item -ItemType Directory `
            -Path $desktopPath -Force | Out-Null

          $msgContent = @"
          ======================================
                    MILIK ARIANTO
          ======================================

          Desktop Windows RDP
          Terima kasih sudah menggunakan layanan ini.
          Semoga lancar rezeki dan selalu sehat.

          ======================================
          @Arianto 2026
          Lumajang - Candipuro
          ======================================
          "@

          Set-Content `
            -Path "$desktopPath\INFORMASI_PEMILIK_VPS.txt" `
            -Value $msgContent -Encoding UTF8

          Write-Host "Informasi pemilik dibuat."

      - name: Instalasi dan Koneksi Tailscale
        shell: pwsh
        env:
          TAILSCALE_KEY: ${{ inputs.tailscale_key }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Output "::add-mask::$env:TAILSCALE_KEY"

          $installer = "$env:TEMP\tailscale-setup.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.88.4-amd64.msi" `
            -OutFile $installer `
            -TimeoutSec 60

          $install = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          if ($install.ExitCode -notin @(0, 3010)) {
            throw "Instalasi Tailscale gagal."
          }

          $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscalePath)) {
            throw "Executable Tailscale tidak ditemukan."
          }

          & $tailscalePath up `
            "--authkey=$env:TAILSCALE_KEY" `
            --accept-routes

          if ($LASTEXITCODE -ne 0) {
            throw "Koneksi Tailscale gagal."
          }

          Start-Sleep -Seconds 8

          $tsIp = (& $tailscalePath ip -4 |
            Select-Object -First 1).Trim()

          if (-not $tsIp) {
            throw "IP Tailscale tidak ditemukan."
          }

          "TAILSCALE_IP=$tsIp" >> $env:GITHUB_ENV

          Write-Host "===================================="
          Write-Host "IP TAILSCALE: $tsIp"
          Write-Host "===================================="

      - name: Aktifkan Fitur Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name UserAuthentication -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Write-Host "Konfigurasi Remote Desktop selesai."

      - name: Kirim Gambar dan Informasi RDP ke Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "1908469040"
          RDP_USER: ${{ inputs.input_user }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:BOT_TOKEN)) {
            throw "GitHub Secret BOT_TOKEN belum dikonfigurasi."
          }

          Write-Output "::add-mask::$env:BOT_TOKEN"

          $photoUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgRFqAvUV6j9-n3L65cySSsdK3JHZ88fKJlquXCK5pGhNRRlOmYfnIb3Zk4Y7SUC232-P5VcYgFZgiJ7jPfTR4HUmKtiOLG60FzYgby4m52MHOgXB0JuV5KZaR_3tdOPH5USQOqBx2GHYj_KTnntxjNzKKIh0VPFLAOaNoBlVJZi13KPvoWgjRRseVZObA/s1600/1000184023.jpg"

          $tsIp = $env:TAILSCALE_IP

          if (-not $tsIp) {
            $tsIp = "IP belum tersedia"
          }

          $caption = @"
          ⚡ ARIANTO RDP CYBERPUNK ⚡

          🖥️ Sistem: Windows RDP
          🌐 IP Tailscale: $tsIp
          👤 Username: $env:RDP_USER
          🔐 Password: tidak disertakan demi keamanan

          📡 VPN: Tailscale
          📌 Status: Workflow berjalan

          © @Arianto 2026
          Lumajang - Candipuro
          "@

          $payload = @{
            chat_id = $env:CHAT_ID
            photo = $photoUrl
            caption = $caption.Trim()
          }

          try {
            $result = Invoke-RestMethod `
              -Uri "https://api.telegram.org/bot$env:BOT_TOKEN/sendPhoto" `
              -Method Post `
              -Body $payload `
              -TimeoutSec 30

            if (-not $result.ok) {
              throw "Telegram tidak mengonfirmasi pengiriman."
            }

            Write-Host "Gambar dan informasi berhasil dikirim ke Telegram."
          }
          catch {
            Write-Host "Pengiriman Telegram gagal: $($_.Exception.Message)"
            throw
          }

      - name: Menjaga Workflow Tetap Aktif
        shell: pwsh
        run: |
          Write-Host "Workflow Cyberpunk sedang berjalan."

          while ($true) {
            Start-Sleep -Seconds 30
            Write-Host "Status: workflow masih aktif."
          }
