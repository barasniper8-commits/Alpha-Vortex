name: Windows RDP Cyberpunk

on:
  workflow_dispatch:
    inputs:
      pass_code:
        description: 'Pass Kode'
        required: true
        type: string
      input_user:
        description: 'Username RDP'
        required: true
        type: string
      input_password:
        description: 'Password RDP'
        required: true
        type: string
      tailscale_key:
        description: 'Tailscale Auth Key'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Cloudflare Bypass Tool
      run: pip install cloudscraper

    - name: Membaca & Memvalidasi Web HTML Lynk.id
      id: fetch-cred
      shell: pwsh
      run: |
        $u1 = "https://arianto1"
        $u2 = "2.lynk.id/p/ganjay"
        $targetUrl = "$u1$u2"
        
        [Console]::WriteLine("::add-mask::$targetUrl")
        
        # Jalankan Python untuk menembus Cloudflare Lynk.id
        $pyCode = @"
        import cloudscraper
        import base64
        import os

        scraper = cloudscraper.create_scraper()
        try:
            res = scraper.get("$targetUrl")
            html = res.text
            b64 = base64.b64encode(html.encode('utf-8')).decode('utf-8')
            with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                fh.write(f"html_b64={b64}\n")
            print("Status: Berhasil melewati Cloudflare dan mengambil HTML!")
        except Exception as e:
            print(f"Peringatan: Gagal total: {e}")
            with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                fh.write("html_b64=BYPASS\n")
        "@
        
        $pyCode | python -

    - name: Verifikasi Passcode
      env:
        HTML_B64: ${{ steps.fetch-cred.outputs.html_b64 }}
        INPUT_PASSCODE: ${{ github.event.inputs.pass_code }}
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.Web
        
        $inputCode = $env:INPUT_PASSCODE.Trim()
        $b64 = $env:HTML_B64

        Write-Host "=========================================="
        Write-Host "INPUT PASSCODE ANDA : '$inputCode'"
        Write-Host "=========================================="

        if ($b64 -eq "BYPASS") {
            Write-Error "ERROR: Gagal terhubung ke Lynk.id akibat proteksi Cloudflare."
            exit 1
        }

        $decodedBytes = [System.Convert]::FromBase64String($b64)
        $htmlContent = [System.Text.Encoding]::UTF8.GetString($decodedBytes)

        $allowedCodes = @()
        if ($htmlContent -match "passcode\s*[:=]\s*([^<]+)") {
            $rawText = $Matches[1].Trim()
            $allowedCodes = $rawText -split ',' | ForEach-Object { $_.Trim() }
        }

        $matchFound = $false
        foreach ($code in $allowedCodes) {
            if ($code -eq $inputCode) {
                $matchFound = $true
                break
            }
        }

        if (-not $matchFound -and $htmlContent.Contains($inputCode)) {
            $matchFound = $true
        }

        if ($matchFound) {
            Write-Host "Status: Passcode '$inputCode' KETEMU dan TERVERIFIKASI!" -ForegroundColor Green
        } else {
            Write-Error "ERROR: Passcode '$inputCode' SALAH atau TIDAK DITEMUKAN di halaman Lynk.id!"
            exit 1
        }

    - name: Konfigurasi Tampilan Dark Mode
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0
        Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0

    - name: Verifikasi & Pembuatan Akun RDP
      shell: pwsh
      run: |
        $inputUser = "${{ github.event.inputs.input_user }}".Trim()
        $inputPass = "${{ github.event.inputs.input_password }}".Trim()
        
        Write-Host "::add-mask::$inputPass"

        net user $inputUser $inputPass /add
        net localgroup administrators $inputUser /add
        Write-Host "Status: Akun RDP '$inputUser' berhasil dibuat dan berstatus Administrator."

    - name: Set Foto Profil & Wallpaper Desktop
      env:
        RDP_USER: ${{ github.event.inputs.input_user }}
      shell: pwsh
      run: |
        $avatarUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjFqQRxOHnZXYINO_52beLKrfrMypBHzpnllWSHx6gQHO4yspMqi2skpfp8z0lvsOOWHjSJ6G33I8Y2rGXo8_FVAkrgnDxtYuWK_Z5go81NcvEoRV6koacWRU4HsXD0R3nqW69a1FJnxhzy2PI8z2PQKqxWIEc_mX3oOROBIj9Y3HW4NcEq6FcNzMyMMwA/s1600/1000184069.jpg"
        $avatarPath = "C:\ProgramData\Microsoft\User Account Pictures"
        
        try {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12, [Net.SecurityProtocolType]::Tls13
            $wc = New-Object System.Net.WebClient
            $wc.Headers.Add("User-Agent", "Mozilla/5.0")
            $wc.DownloadFile($avatarUrl, "C:\avatar.jpg")
            
            if (-not (Test-Path $avatarPath)) { New-Item -ItemType Directory -Force -Path $avatarPath }
            
            Copy-Item "C:\avatar.jpg" "$avatarPath\$env:RDP_USER.jpg" -Force
            Copy-Item "C:\avatar.jpg" "$avatarPath\default.jpg" -Force
            
            $userSid = (New-Object System.Security.Principal.NTAccount($env:RDP_USER)).Translate([System.Security.Principal.SecurityIdentifier]).Value
            $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AccountPicture\Users\$userSid"
            if (!(Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
            
            New-ItemProperty -Path $regPath -Name "Image448" -Value "C:\avatar.jpg" -PropertyType String -Force | Out-Null
            New-ItemProperty -Path $regPath -Name "Image192" -Value "C:\avatar.jpg" -PropertyType String -Force | Out-Null
            Write-Output "Foto profil JPG berhasil dipasang."
        } catch {
            Write-Output "Peringatan: Gagal mengunduh foto profil: $_"
        }

        $wallpaperUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgRFqAvUV6j9-n3L65cySSsdK3JHZ88fKJlquXCK5pGhNRRlOmYfnIb3Zk4Y7SUC232-P5VcYgFZgiJ7jPfTR4HUmKtiOLG60FzYgby4m52MHOgXB0JuV5KZaR_3tdOPH5USQOqBx2GHYj_KTnntxjNzKKIh0VPFLAOaNoBlVJZi13KPvoWgjRRseVZObA/s1600/1000184023.jpg"
        try {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12, [Net.SecurityProtocolType]::Tls13
            
            Invoke-WebRequest -Uri $wallpaperUrl -OutFile "C:\wallpaper.jpg" -UserAgent "Mozilla/5.0" -UseBasicParsing
            
            if (Test-Path "C:\wallpaper.jpg") {
                takeown /f "C:\Windows\Web\Wallpaper\Windows\img0.jpg" /a
                icacls "C:\Windows\Web\Wallpaper\Windows\img0.jpg" /grant "Administrators:F"
                Copy-Item "C:\wallpaper.jpg" "C:\Windows\Web\Wallpaper\Windows\img0.jpg" -Force
                Write-Output "Wallpaper berhasil dipasang."
            } else {
                throw "File wallpaper kosong."
            }
        } catch {
            Write-Output "Mencoba metode alternatif unduh wallpaper..."
            try {
                $wcW = New-Object System.Net.WebClient
                $wcW.Headers.Add("User-Agent", "Mozilla/5.0")
                $wcW.DownloadFile($wallpaperUrl, "C:\wallpaper.jpg")
                
                takeown /f "C:\Windows\Web\Wallpaper\Windows\img0.jpg" /a
                icacls "C:\Windows\Web\Wallpaper\Windows\img0.jpg" /grant "Administrators:F"
                Copy-Item "C:\wallpaper.jpg" "C:\Windows\Web\Wallpaper\Windows\img0.jpg" -Force
                Write-Output "Wallpaper berhasil dipasang menggunakan metode alternatif."
            } catch {
                Write-Output "Peringatan: Gagal total mengunduh wallpaper: $_"
            }
        }

    - name: Buat Teks Informasi Pemilik di Desktop
      shell: pwsh
      run: |
        $desktopPath = [Environment]::GetFolderPath('CommonDesktopDirectory')
        if (-not (Test-Path $desktopPath)) { $desktopPath = "C:\Users\Public\Desktop" }
        
        $msgContent = "======================================`nMILIK ARIANTO`n======================`nDesktop free terima kasih sudah beli token`ndan semoga lancar rezeki sehat selalu.`n======================`n@Arianto 2026 Lumajang Candipuro`n@WhatsApp 0831-2211-6267"
        
        Set-Content -Path "$desktopPath\INFORMASI_PEMILIK_VPS.txt" -Value $msgContent -Encoding UTF8
        Write-Output "File informasi teks berhasil dibuat di desktop."

    - name: Instalasi & Koneksi Tailscale VPN
      shell: pwsh
      run: |
        $installer = "$env:TEMP\tailscale-setup.msi"
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.88.4-amd64.msi" -OutFile $installer
        Start-Process msiexec.exe -Wait -ArgumentList "/i $installer /quiet /norestart"
        
        $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
        & $tailscalePath up --authkey="${{ github.event.inputs.tailscale_key }}" --accept-routes
        
        Start-Sleep -Seconds 5
        $tsIp = &$tailscalePath ip -4
        Write-Host "=========================================="
        Write-Host "IP TAILSCALE VPS ANDA: $tsIp" -ForegroundColor Cyan
        Write-Host "=========================================="

    - name: Kirim Informasi RDP ke Telegram Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: "1908469040"
        RDP_USER: ${{ github.event.inputs.input_user }}
        RDP_PASS: ${{ github.event.inputs.input_password }}
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.Web
        $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe";
        Start-Sleep -Seconds 10;
        
        $tsIp = (&$tailscalePath ip -4 | Select-Object -First 1).Trim();
        if (-not $tsIp) {$tsIp = "Cek Console Tailscale" };
        
        $rdpUser =$env:RDP_USER;
        $rdpPass =$env:RDP_PASS;
        
        $photoUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgRFqAvUV6j9-n3L65cySSsdK3JHZ88fKJlquXCK5pGhNRRlOmYfnIb3Zk4Y7SUC232-P5VcYgFZgiJ7jPfTR4HUmKtiOLG60FzYgby4m52MHOgXB0JuV5KZaR_3tdOPH5USQOqBx2GHYj_KTnntxjNzKKIh0VPFLAOaNoBlVJZi13KPvoWgjRRseVZObA/s1600/1000184023.jpg";
        
        $msgText = "⚡ [ RDP CYBERPUNK READY ] ⚡`n`n🖥️ IP RDP: $tsIp`n👤 User: $rdpUser`n🔑 Password: $rdpPass`n`nSilakan gunakan aplikasi Remote Desktop (RDP) via Tailscale untuk terhubung!";
        
        $encodedCaption = [System.Web.HttpUtility]::UrlEncode($msgText);$encodedPhoto = [System.Web.HttpUtility]::UrlEncode($photoUrl);$uri = "https://api.telegram.org/bot$env:BOT_TOKEN/sendPhoto?chat_id=$env:CHAT_ID&photo=$encodedPhoto&caption=$encodedCaption";
        
        try {
            Invoke-RestMethod -Uri $uri -Method Get;
            Write-Host "Status: Informasi RDP berserta Gambar berhasil dikirim ke Telegram Anda!";
        } catch {
            Write-Host "Peringatan: Gagal mengirim foto ke Telegram: $_";
        }

    - name: Mengaktifkan Fitur Remote Desktop (RDP)
      shell: pwsh
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Write-Host "Status: Service RDP Berhasil Diaktifkan di Windows Server."

    - name: Menjaga Workflow Tetap Aktif
      shell: pwsh
      run: |
        Write-Host "VPS RDP Cyberpunk berhasil diaktifkan!"
        while ($true) {
            Start-Sleep -Seconds 30
        }
